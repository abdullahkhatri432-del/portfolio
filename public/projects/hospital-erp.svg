<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Hospital ERP clinical dashboard preview">
  <defs>
    <linearGradient id="he-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08202E"/>
      <stop offset="55%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#04060D"/>
    </linearGradient>
    <linearGradient id="he-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="he-glow" cx="24%" cy="14%" r="60%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="he-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#he-bg)"/>
  <rect width="1200" height="750" fill="url(#he-grid)"/>
  <rect width="1200" height="750" fill="url(#he-glow)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="212" height="750" fill="#0D1220"/>
  <line x1="212" y1="0" x2="212" y2="750" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <rect x="24" y="26" width="32" height="32" rx="9" fill="url(#he-brand)"/>
  <path d="M32 42 h5 l3 -7 l4 13 l3 -6 h5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="42" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Meridian</text>
  <text x="66" y="56" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">Hospital ERP</text>
  <line x1="0" y1="80" x2="212" y2="80" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="26" y="106" font-family="'Segoe UI',sans-serif" font-size="9" letter-spacing="1.4" fill="#64748B">CLINICAL</text>
  <rect x="16" y="116" width="180" height="30" rx="8" fill="#0EA5E9" opacity="0.13"/>
  <rect x="16" y="116" width="3" height="30" rx="1.5" fill="#0EA5E9"/>
  <g font-family="'Segoe UI',sans-serif" font-size="11.5">
    <text x="46" y="136" fill="#7DD3FC">Overview</text>
    <text x="46" y="170" fill="#94A3B8">Patients</text>
    <text x="46" y="200" fill="#94A3B8">Appointments</text>
    <text x="46" y="230" fill="#94A3B8">Laboratory</text>
  </g>
  <g fill="#64748B">
    <circle cx="30" cy="132" r="4"/><circle cx="30" cy="166" r="4"/><circle cx="30" cy="196" r="4"/><circle cx="30" cy="226" r="4"/>
  </g>

  <text x="26" y="266" font-family="'Segoe UI',sans-serif" font-size="9" letter-spacing="1.4" fill="#64748B">OPERATIONS</text>
  <g font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#94A3B8">
    <text x="46" y="296">Pharmacy</text>
    <text x="46" y="326">Billing</text>
    <text x="46" y="356">Insurance</text>
    <text x="46" y="386">Medical staff</text>
  </g>
  <g fill="#64748B">
    <circle cx="30" cy="292" r="4"/><circle cx="30" cy="322" r="4"/><circle cx="30" cy="352" r="4"/><circle cx="30" cy="382" r="4"/>
  </g>

  <rect x="16" y="690" width="180" height="1" fill="#FFFFFF" opacity="0.08"/>
  <text x="26" y="714" font-family="'Segoe UI',sans-serif" font-size="9" fill="#475569">Demonstration system.</text>
  <text x="26" y="728" font-family="'Segoe UI',sans-serif" font-size="9" fill="#475569">All records fictional.</text>

  <!-- Header -->
  <text x="244" y="42" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Clinical Overview</text>
  <text x="244" y="60" font-family="'Segoe UI',sans-serif" font-size="11" fill="#64748B">Deterioration watchlist and operational alerts</text>
  <rect x="1000" y="30" width="164" height="24" rx="12" fill="#22C55E" opacity="0.12" stroke="#22C55E" stroke-opacity="0.25"/>
  <circle cx="1018" cy="42" r="4" fill="#22C55E"/>
  <text x="1030" y="46" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86EFAC">Systems nominal</text>
  <line x1="212" y1="80" x2="1200" y2="80" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- KPI row -->
  <g>
    <rect x="244" y="102" width="222" height="104" rx="14" fill="#0D1220" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="264" y="120" width="30" height="30" rx="9" fill="#0EA5E9" opacity="0.12"/>
    <rect x="271" y="130" width="16" height="10" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="264" y="180" font-family="monospace" font-size="24" font-weight="700" fill="#F1F5F9">3</text>
    <text x="264" y="196" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Currently admitted</text>

    <rect x="482" y="102" width="222" height="104" rx="14" fill="#0D1220" stroke="#EF4444" stroke-opacity="0.25"/>
    <rect x="502" y="120" width="30" height="30" rx="9" fill="#EF4444" opacity="0.14"/>
    <path d="M517 128 l8 14 h-16 z" fill="none" stroke="#F87171" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="502" y="180" font-family="monospace" font-size="24" font-weight="700" fill="#F87171">2</text>
    <text x="502" y="196" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Requiring escalation</text>

    <rect x="720" y="102" width="222" height="104" rx="14" fill="#0D1220" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="740" y="120" width="30" height="30" rx="9" fill="#0EA5E9" opacity="0.12"/>
    <rect x="747" y="128" width="16" height="15" rx="2.5" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="740" y="180" font-family="monospace" font-size="24" font-weight="700" fill="#F1F5F9">5</text>
    <text x="740" y="196" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Appointments today</text>

    <rect x="958" y="102" width="206" height="104" rx="14" fill="#0D1220" stroke="#F59E0B" stroke-opacity="0.22"/>
    <rect x="978" y="120" width="30" height="30" rx="9" fill="#F59E0B" opacity="0.14"/>
    <text x="987" y="141" font-family="'Segoe UI',sans-serif" font-size="14" fill="#FBBF24">₹</text>
    <text x="978" y="180" font-family="monospace" font-size="24" font-weight="700" fill="#FBBF24">₹1.02L</text>
    <text x="978" y="196" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Outstanding balance</text>
  </g>

  <!-- Deterioration watchlist -->
  <rect x="244" y="226" width="580" height="326" rx="14" fill="#0D1220" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="266" y="256" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Deterioration watchlist</text>
  <text x="266" y="272" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">Admitted patients ranked by latest NEWS2 aggregate score</text>
  <rect x="690" y="242" width="112" height="22" rx="11" fill="#EF4444" opacity="0.14"/>
  <text x="746" y="257" font-family="'Segoe UI',sans-serif" font-size="10" fill="#F87171" text-anchor="middle">2 need review</text>
  <line x1="244" y1="288" x2="824" y2="288" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="'Segoe UI',sans-serif" font-size="9" letter-spacing="1" fill="#64748B">
    <text x="266" y="308">PATIENT</text><text x="452" y="308">WARD</text><text x="560" y="308">NEWS2</text><text x="640" y="308">RISK</text><text x="760" y="308">LAST OBS</text>
  </g>

  <!-- Row 1: critical -->
  <rect x="244" y="318" width="580" height="58" fill="#EF4444" opacity="0.05"/>
  <text x="266" y="342" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#F1F5F9">Ramesh Bhatt</text>
  <text x="266" y="358" font-family="monospace" font-size="9.5" fill="#475569">MRN-2026-1042</text>
  <text x="452" y="348" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#94A3B8">ICU · ICU-04</text>
  <rect x="558" y="334" width="30" height="28" rx="7" fill="#EF4444" opacity="0.16"/>
  <text x="573" y="353" font-family="monospace" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle">17</text>
  <text x="640" y="344" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#F87171">High</text>
  <text x="640" y="358" font-family="'Segoe UI',sans-serif" font-size="9" fill="#FBBF24">single-param red flag</text>
  <text x="760" y="348" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569">1h ago</text>

  <!-- Row 2: medium -->
  <line x1="244" y1="376" x2="824" y2="376" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="266" y="400" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#F1F5F9">Fatima Ansari</text>
  <text x="266" y="416" font-family="monospace" font-size="9.5" fill="#475569">MRN-2026-1045</text>
  <text x="452" y="406" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#94A3B8">Paediatrics · P-06</text>
  <rect x="558" y="392" width="30" height="28" rx="7" fill="#F97316" opacity="0.16"/>
  <text x="573" y="411" font-family="monospace" font-size="15" font-weight="700" fill="#FB923C" text-anchor="middle">5</text>
  <text x="640" y="410" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#FB923C">Medium</text>
  <text x="760" y="410" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569">3h ago</text>

  <!-- Row 3: low -->
  <line x1="244" y1="434" x2="824" y2="434" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="266" y="458" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#F1F5F9">Lakshmi Iyer</text>
  <text x="266" y="474" font-family="monospace" font-size="9.5" fill="#475569">MRN-2026-1043</text>
  <text x="452" y="464" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#94A3B8">Cardiology · C-12</text>
  <rect x="558" y="450" width="30" height="28" rx="7" fill="#22C55E" opacity="0.16"/>
  <text x="573" y="469" font-family="monospace" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="middle">0</text>
  <text x="640" y="468" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#4ADE80">Low</text>
  <text x="760" y="468" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569">2h ago</text>

  <line x1="244" y1="500" x2="824" y2="500" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="266" y="522" font-family="'Segoe UI',sans-serif" font-size="9" fill="#475569">NEWS2 (Royal College of Physicians, 2017) is a deterioration detection aid</text>
  <text x="266" y="536" font-family="'Segoe UI',sans-serif" font-size="9" fill="#475569">for trained staff. It supports clinical judgement and does not replace it.</text>

  <!-- Operational alerts -->
  <rect x="842" y="226" width="322" height="326" rx="14" fill="#0D1220" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="864" y="256" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Operational alerts</text>
  <line x1="842" y1="272" x2="1164" y2="272" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <path d="M872 292 l8 14 h-16 z" fill="none" stroke="#F87171" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="892" y="298" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#F1F5F9">Expired batch — Brufen 400</text>
  <text x="892" y="313" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">Batch BRU-1188. Quarantine.</text>
  <line x1="842" y1="330" x2="1164" y2="330" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <path d="M864 350 l8 8 l8 -8" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  <text x="892" y="352" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#F1F5F9">Below reorder — Glycomet 500</text>
  <text x="892" y="367" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">68 in stock, reorder at 150.</text>
  <line x1="842" y1="384" x2="1164" y2="384" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <path d="M864 402 h5 l3 -6 l4 11 l3 -5 h5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="892" y="406" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#F1F5F9">2 lab reports pending</text>
  <text x="892" y="421" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">ABG, Serum Electrolytes</text>
  <line x1="842" y1="438" x2="1164" y2="438" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <path d="M864 458 l6 -8 l6 6 l6 -10" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="460" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#F1F5F9">2 claims awaiting settlement</text>
  <text x="892" y="475" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">₹38.2K claimed</text>

  <!-- Prescription safety alert strip -->
  <rect x="244" y="570" width="920" height="150" rx="14" fill="#0D1220" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="266" y="598" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Prescribing safety engine</text>
  <text x="266" y="614" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B">Allergy, interaction, duplication and stock rules run on every change</text>
  <rect x="1040" y="584" width="104" height="22" rx="11" fill="#EF4444" opacity="0.14"/>
  <text x="1092" y="599" font-family="'Segoe UI',sans-serif" font-size="10" fill="#F87171" text-anchor="middle">2 alerts</text>

  <rect x="266" y="630" width="430" height="70" rx="11" fill="#EF4444" opacity="0.07" stroke="#EF4444" stroke-opacity="0.28"/>
  <circle cx="288" cy="652" r="7" fill="none" stroke="#F87171" stroke-width="1.6"/>
  <line x1="283" y1="647" x2="293" y2="657" stroke="#F87171" stroke-width="1.6"/>
  <text x="304" y="656" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#F87171">Interaction: warfarin + aspirin</text>
  <text x="304" y="672" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#94A3B8">Markedly increased bleeding risk through combined</text>
  <text x="304" y="685" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#94A3B8">anticoagulant and antiplatelet action.</text>

  <rect x="712" y="630" width="432" height="70" rx="11" fill="#EF4444" opacity="0.07" stroke="#EF4444" stroke-opacity="0.28"/>
  <path d="M734 645 l0 8 M734 658 l0 1" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
  <path d="M734 638 a10 10 0 1 0 0.1 0" fill="none" stroke="#F87171" stroke-width="1.5"/>
  <text x="754" y="656" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#F87171">Allergy conflict: Amoxil 500</text>
  <text x="754" y="672" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#94A3B8">Severe penicillin allergy (anaphylaxis) recorded.</text>
  <text x="754" y="685" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#94A3B8">Amoxicillin may cross-react.</text>
</svg>
