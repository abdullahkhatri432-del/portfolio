<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Multi-Vendor Marketplace vendor dashboard preview">
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A0F2E"/>
      <stop offset="55%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="mk-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="mk-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="mk-glow" cx="18%" cy="14%" r="60%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mk-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#mk-bg)"/>
