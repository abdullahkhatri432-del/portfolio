<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="AI Interview Simulator live analysis preview">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1038"/>
      <stop offset="55%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="ai-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ai-feed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="100%" stop-color="#0D1428"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="30%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ai-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#ai-bg)"/>
  <rect width="1200" height="750" fill="url(#ai-grid)"/>
  <rect width="1200" height="750" fill="url(#ai-glow)"/>

  <!-- Chrome -->
  <rect x="70" y="60" width="1060" height="630" rx="22" fill="#0B1024" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="70" y="60" width="1060" height="50" rx="22" fill="#16112E"/>
  <rect x="70" y="92" width="1060" height="18" fill="#16112E"/>
  <circle cx="102" cy="85" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="124" cy="85" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="146" cy="85" r="6" fill="#22C55E" opacity="0.8"/>
  <rect x="180" y="76" width="290" height="19" rx="9.5" fill="#0A0F24" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="195" y="90" font-family="monospace" font-size="11" fill="#64748B">interview-sim.vercel.app</text>
  <rect x="920" y="74" width="184" height="22" rx="11" fill="#22C55E" opacity="0.16"/>
  <text x="1012" y="89" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86EFAC" text-anchor="middle">100% ON-DEVICE · NO UPLOAD</text>

  <!-- Progress bar -->
  <g>
    <rect x="94" y="130" width="150" height="4" rx="2" fill="#22C55E"/>
    <rect x="252" y="130" width="150" height="4" rx="2" fill="#22C55E"/>
    <rect x="410" y="130" width="150" height="4" rx="2" fill="#06B6D4"/>
    <rect x="568" y="130" width="150" height="4" rx="2" fill="#FFFFFF" opacity="0.12"/>
    <rect x="726" y="130" width="150" height="4" rx="2" fill="#FFFFFF" opacity="0.12"/>
    <rect x="884" y="130" width="150" height="4" rx="2" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <text x="94" y="122" font-family="'Segoe UI',sans-serif" font-size="11" fill="#94A3B8">HR &amp; Behavioural · Question 3 of 6</text>

  <!-- Video feed -->
  <rect x="94" y="152" width="640" height="360" rx="18" fill="url(#ai-feed)" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Face mesh wireframe -->
  <g transform="translate(414, 322)">
    <ellipse cx="0" cy="0" rx="86" ry="108" fill="#7C3AED" opacity="0.10"/>
    <ellipse cx="0" cy="0" rx="86" ry="108" fill="none" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke="#06B6D4" stroke-opacity="0.35" stroke-width="0.8" fill="none">
      <path d="M-86 -20 L86 -20"/><path d="M-80 20 L80 20"/><path d="M-64 58 L64 58"/><path d="M-40 -62 L40 -62"/>
      <path d="M0 -108 L0 108"/><path d="M-44 -100 L-44 92"/><path d="M44 -100 L44 92"/>
    </g>
    <!-- Landmarks -->
    <g fill="#67E8F9">
      <circle cx="-34" cy="-24" r="3.5"/><circle cx="34" cy="-24" r="3.5"/>
      <circle cx="0" cy="8" r="2.5"/><circle cx="-22" cy="48" r="2.5"/><circle cx="22" cy="48" r="2.5"/><circle cx="0" cy="52" r="2.5"/>
      <circle cx="0" cy="-70" r="2.5"/><circle cx="-58" cy="0" r="2.5"/><circle cx="58" cy="0" r="2.5"/>
    </g>
    <g fill="#A78BFA" opacity="0.75">
      <circle cx="-50" cy="-46" r="2"/><circle cx="50" cy="-46" r="2"/><circle cx="-46" cy="26" r="2"/><circle cx="46" cy="26" r="2"/>
      <circle cx="-26" cy="76" r="2"/><circle cx="26" cy="76" r="2"/><circle cx="0" cy="90" r="2"/>
    </g>
    <!-- Gaze vector -->
    <line x1="-34" y1="-24" x2="-34" y2="-96" stroke="#22C55E" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>
    <line x1="34" y1="-24" x2="34" y2="-96" stroke="#22C55E" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>
  </g>

  <!-- Bounding box -->
  <g stroke="#22C55E" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M300 196 L300 176 L320 176"/><path d="M508 176 L528 176 L528 196"/>
    <path d="M528 448 L528 468 L508 468"/><path d="M320 468 L300 468 L300 448"/>
  </g>
  <rect x="300" y="176" width="228" height="18" rx="4" fill="#22C55E" opacity="0.18"/>
  <text x="310" y="189" font-family="monospace" font-size="10" fill="#86EFAC">face detected · 478 landmarks</text>

  <!-- REC indicator -->
  <rect x="112" y="170" width="106" height="28" rx="14" fill="#000000" opacity="0.62"/>
  <circle cx="130" cy="184" r="5" fill="#EF4444"/>
  <text x="146" y="189" font-family="monospace" font-size="12" fill="#FFFFFF">1:24</text>

  <!-- Question card -->
  <rect x="94" y="528" width="640" height="146" rx="16" fill="#12182F" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="116" y="556" font-family="'Segoe UI',sans-serif" font-size="10" letter-spacing="2" fill="#64748B">QUESTION</text>
  <text x="116" y="584" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Tell me about a time something you built broke.</text>
  <text x="116" y="608" font-family="'Segoe UI',sans-serif" font-size="13" fill="#94A3B8">What happened, and what did you change afterwards?</text>
  <rect x="116" y="626" width="150" height="32" rx="16" fill="#EF4444" opacity="0.9"/>
  <rect x="130" y="637" width="10" height="10" rx="2" fill="#FFFFFF"/>
  <text x="196" y="646" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Finish Answer</text>
  <text x="290" y="646" font-family="'Segoe UI',sans-serif" font-size="11" fill="#64748B">Suggested length ~120s</text>

  <!-- Sidebar: live signals -->
  <rect x="754" y="152" width="352" height="330" rx="18" fill="#12182F" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="776" y="182" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Live Signals</text>

  <rect x="776" y="196" width="308" height="34" rx="10" fill="#22C55E" opacity="0.10"/>
  <circle cx="794" cy="213" r="5" fill="#22C55E"/>
  <text x="810" y="217" font-family="'Segoe UI',sans-serif" font-size="11" fill="#FFFFFF">Face detected</text>
  <circle cx="1008" cy="213" r="4" fill="#06B6D4"/>
  <text x="1020" y="217" font-family="'Segoe UI',sans-serif" font-size="10" fill="#67E8F9">Speaking</text>

  <!-- Meters -->
  <g font-family="'Segoe UI',sans-serif" font-size="10.5">
    <text x="776" y="256" fill="#94A3B8">Camera engagement</text>
    <text x="1084" y="256" fill="#FFFFFF" text-anchor="end">82%</text>
    <rect x="776" y="262" width="308" height="6" rx="3" fill="#FFFFFF" opacity="0.09"/>
    <rect x="776" y="262" width="253" height="6" rx="3" fill="#7C3AED"/>

    <text x="776" y="294" fill="#94A3B8">Voice level</text>
    <text x="1084" y="294" fill="#FFFFFF" text-anchor="end">64%</text>
    <rect x="776" y="300" width="308" height="6" rx="3" fill="#FFFFFF" opacity="0.09"/>
    <rect x="776" y="300" width="197" height="6" rx="3" fill="#06B6D4"/>

    <text x="776" y="332" fill="#94A3B8">Framing</text>
    <text x="1084" y="332" fill="#FFFFFF" text-anchor="end">91%</text>
    <rect x="776" y="338" width="308" height="6" rx="3" fill="#FFFFFF" opacity="0.09"/>
    <rect x="776" y="338" width="280" height="6" rx="3" fill="#22C55E"/>

    <text x="776" y="370" fill="#94A3B8">Head steadiness</text>
    <text x="1084" y="370" fill="#FFFFFF" text-anchor="end">+4°</text>
    <rect x="776" y="376" width="308" height="6" rx="3" fill="#FFFFFF" opacity="0.09"/>
    <rect x="776" y="376" width="268" height="6" rx="3" fill="#F59E0B"/>

    <text x="776" y="408" fill="#94A3B8">Expression signal</text>
    <text x="1084" y="408" fill="#FFFFFF" text-anchor="end">active</text>
    <rect x="776" y="414" width="308" height="6" rx="3" fill="#FFFFFF" opacity="0.09"/>
    <rect x="776" y="414" width="132" height="6" rx="3" fill="#F472B6"/>
  </g>
  <text x="930" y="448" font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">pitch ≈ 142 Hz · autocorrelation</text>
  <rect x="776" y="458" width="308" height="1" fill="#FFFFFF" opacity="0.07"/>
  <text x="930" y="474" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">expression signals ≠ emotion detection</text>

  <!-- Transcript -->
  <rect x="754" y="496" width="352" height="178" rx="18" fill="#12182F" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="776" y="524" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Transcript</text>
  <rect x="1012" y="512" width="72" height="18" rx="9" fill="#06B6D4" opacity="0.18"/>
  <text x="1048" y="525" font-family="'Segoe UI',sans-serif" font-size="9" fill="#67E8F9" text-anchor="middle">LISTENING</text>
  <g font-family="'Segoe UI',sans-serif" font-size="11" fill="#94A3B8">
    <text x="776" y="550">So we had a webhook that silently</text>
    <text x="776" y="570">failed under load. <tspan fill="#F59E0B">um</tspan> I noticed the</text>
    <text x="776" y="590">order count didn't match payments,</text>
    <text x="776" y="610">so I added idempotency keys and a</text>
    <text x="776" y="630">retry queue with backoff…</text>
  </g>
  <rect x="776" y="644" width="70" height="18" rx="9" fill="#F59E0B" opacity="0.16"/>
  <text x="811" y="657" font-family="'Segoe UI',sans-serif" font-size="9" fill="#FBBF24" text-anchor="middle">"um" × 2</text>
  <text x="862" y="657" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748B">148 wpm · 96 words</text>
</svg>
